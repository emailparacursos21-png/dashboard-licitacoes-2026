    :root {
      --bg-primary: #0a0f1d;
      --bg-secondary: #11192d;
      --bg-card: #162038;
      --border-color: #223254;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-indigo: #6366f1;
      --accent-green: #10b981;

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-main); padding: 14px 18px; min-height: 100vh; }
    .dashboard-wrapper { width: 100%; display: flex; flex-direction: column; gap: 14px; }

    header {
      background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
      border: 1px solid var(--border-color); border-radius: var(--radius);
      padding: 16px 20px; display: flex; flex-wrap: wrap; justify-content: space-between;
      align-items: center; gap: 12px; box-shadow: var(--shadow);
    }
    .header-title h1 { font-size: 1.35rem; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 10px; }
    .header-title p { color: var(--text-muted); font-size: 0.82rem; margin-top: 3px; }
    .header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    .live-badge {
      display: flex; align-items: center; gap: 8px; background: rgba(16, 185, 129, 0.12);
      color: var(--accent-green); padding: 6px 12px; border-radius: 999px;
      font-size: 0.75rem; font-weight: 600; border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .pulse-dot { width: 8px; height: 8px; background: var(--accent-green); border-radius: 50%; animation: pulse 1.8s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

    .btn-action {
      background: var(--border-color); color: #fff; border: none; padding: 7px 14px;
      border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600;
      display: flex; align-items: center; gap: 6px;
    }
    .btn-action:hover { background: #334468; }

    /* Abas */
    .nav-tabs {
      display: flex; gap: 8px; background: var(--bg-secondary); border: 1px solid var(--border-color);
      border-radius: var(--radius); padding: 6px; flex-wrap: wrap;
    }
    .tab-btn {
      background: transparent; color: var(--text-muted); border: 1px solid transparent;
      padding: 9px 16px; border-radius: 7px; cursor: pointer; font-size: 0.84rem;
      font-weight: 600; display: flex; align-items: center; gap: 8px; transition: 0.2s;
    }

    .tab-btn.active.purple-tab { border-color: var(--accent-purple); }
